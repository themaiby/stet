# Policy that applies only under a preset: lang|code|policy lines (semicolon separated)
#
# presets.conf is generated from measurement and carries no opinions. This file
# carries them, one register at a time, because a rule can be wrong for a manual
# and right for a chat reply. A row here reaches the prose section of a run that
# asked for that preset, and no other run.
#
# write-good calls itself a naive linter. On documentation TooWordy fires on
# ordinary words often enough to cost more than it finds.
#
# ColonUsage carries the same advice in its own comment: Vale strips markup
# before matching, so a run-in bold label reaches it as "Fix: Delete" and looks
# like the construction it bans. Documentation uses that label everywhere, and
# on one project 45 findings held three or four worth reading.

en|docs|write-good.TooWordy = NO; ai-tells.ColonUsage = NO
uk|docs|write-good.TooWordy = NO; ai-tells.ColonUsage = NO
