# Language registry. One row per language, pipe separated:
#
#   code | style directory under styles/ | Vale packages (space separated) | default policy lines (semicolon separated)
#
# Packages are pinned rather than tracked at latest. Slop rules decay, so a
# refresh should be a deliberate change with a readable diff: see
# docs/slop-decay.md. Bump the version here when you have looked at what moved.
#
# The 4th field is a starting policy, not a verdict: it switches off rules that
# are too opinionated to be on by default. A project overrides it in its own
# .vale.ini. Adding a language means adding a row here and a styles/<Style>/
# directory. Nothing else in the plugin knows how many languages there are.
# See docs/adding-a-language.md.

