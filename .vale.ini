# This repository's own policy, and a worked example of every lever it offers.
# It points at styles/ directly because this repository is where they live;
# a consuming project gets .vale/styles from `stet init` instead.

StylesPath = styles
MinAlertLevel = suggestion
Vocab = Project

# Pinned, like languages.conf and for the same reason: slop rules decay, and a
# refresh should be a deliberate change with a readable diff.
Packages = https://github.com/tbhb/vale-ai-tells/releases/download/v1.25.0/ai-tells.zip, \
  https://github.com/errata-ai/write-good/releases/download/v0.4.1/write-good.zip

[formats]
csv = txt
tsv = txt
# The registries are English prose around a few pipe-separated rows, and Vale
# has no comment syntax for them, so they are read whole.
conf = txt
ini = txt

[*.{md,txt,csv,tsv,html}]
BasedOnStyles = ProseCore, ProseEN, ENDocs, ai-tells, write-good
Vale.Terms = NO

# Reference files quote Ukrainian terms on purpose.
ProseCore.CommentLanguage = NO

# Forbidding every form of "to be" is a style few projects want.
write-good.E-Prime = NO

# Documentation describes what happens to a file, so the actor is often the file.
write-good.Passive = NO

# Fires on ordinary words, which is what write-good means by naive.
write-good.TooWordy = NO

# Semicolons and colons carry structure in these documents.
ai-tells.SemicolonUsage = NO
ai-tells.ColonUsage = NO

# Reference material enumerates by nature.
ai-tells.VerbTricolon = NO

# The registries are English prose around a few pipe-separated rows. Read as
# plain text they carry no markup, so a file name like .vale.ini arrives as a
# space and a full stop, and an aligned schema line as a run of spaces.
# Typography reads punctuation and cannot tell those from prose here.
[*.{conf,ini}]
BasedOnStyles = ProseCore, ProseEN, ENDocs, ai-tells, write-good
ProseCore.CommentLanguage = NO
write-good.TooWordy = NO
ProseCore.Typography = NO
Vale.Terms = NO
write-good.E-Prime = NO
write-good.Passive = NO
ai-tells.SemicolonUsage = NO
ai-tells.ColonUsage = NO
ai-tells.VerbTricolon = NO

# The repository checks its own comments the way it checks anyone else's, and
# this section is the same policy `stet lint` generates for source files. Shell
# and YAML are absent because Vale extracts no comments from either: shell it
# reads whole, so every case arm turns into a finding, and YAML it skips. That
# leaves scripts/bootstrap.sh and the workflows unchecked.
#
# Everything keyed to punctuation, spacing or line structure is off here. Vale
# keeps the layout of the comment block in the extracted text, so those rules
# report on the block instead of the words.
[*.go]
BasedOnStyles = ProseCore, ProseEN, ai-tells, write-good
ProseCore.Formatting = NO
ProseCore.Typography = NO
Vale.Terms = NO
write-good.TooWordy = NO
write-good.Weasel = NO
write-good.Passive = NO
write-good.E-Prime = NO
ai-tells.FormalRegister = NO
ai-tells.SemicolonUsage = NO
ai-tells.ColonUsage = NO
ai-tells.EmDashUsage = NO
ai-tells.VerbTricolon = NO
